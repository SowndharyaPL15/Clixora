services:
  # Backend Web Service
  - type: web
    name: clixora-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # User will input their free Neon DB connection string here
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://clixora-frontend.onrender.com
      - key: BACKEND_URL
        value: https://clixora-backend-lbtv.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false

  # Frontend Static Site
  - type: web
    name: clixora-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        value: https://clixora-backend-lbtv.onrender.com
      - key: VITE_API_URL
        value: https://clixora-backend-lbtv.onrender.com/api
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
